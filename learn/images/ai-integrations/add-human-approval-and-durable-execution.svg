<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 582" width="880" height="582" role="img" aria-labelledby="t d"><title id="t">Refund approval agent</title><desc id="d">The HTTP service starts a durable refund agent and later reads its result. The agent calls the model and its tools as recorded activities. Issuing a refund needs approval from a support lead, reviewed through the management API. The workflow engine keeps the history so the agent can resume.</desc><defs><symbol id="i-agent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4.5"/><circle cx="12" cy="3.5" r="1"/><path d="M9.5 13v1.5M14.5 13v1.5M2 13v3M22 13v3"/></symbol><symbol id="i-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></symbol><symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9M12 3c-2.5 2.6-3.8 5.6-3.8 9s1.3 6.4 3.8 9"/></symbol><symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/></symbol><symbol id="i-model" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5l1.9 5.1 5.1 1.9-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9z"/><path d="M18.5 15v5M16 17.5h5"/></symbol><symbol id="i-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol><symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol><symbol id="i-tool" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol><symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.8 2.9-6.5 6.5-6.5s6.5 2.7 6.5 6.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 13.8c2.2.8 3.5 3.1 3.5 6.2"/></symbol><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0.8L9.5 5L0 9.2z" fill="#8f9ba1"/></marker></defs><rect x="0.5" y="0.5" width="879" height="581" rx="12" fill="#fcfdfd" stroke="#e3e8ea"/><path d="M90.0 56.0 L90.0 96.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M130.0 418.0 L130.0 350.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ah)"/><path d="M236.0 114.0 L400.0 114.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M400.0 144.0 L236.0 144.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M400.0 304.0 L236.0 304.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M236.0 334.0 L400.0 334.0" fill="none" stroke="#8f9ba