" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#127a75" text-anchor="start">workflow:DurableAgent</text><text x="640.0" y="322.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start">Approvals, survives restarts</text><rect x="40.0" y="350.0" width="800.0" height="46.0" rx="10" fill="#f3f5f6" stroke="#c4ccd0" stroke-width="1.25"/><text x="56.0" y="378.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5f6b73" text-anchor="start">Runs on the rest of your integration</text><rect x="318.0" y="359.0" width="130.9" height="28.0" rx="14" fill="#ffffff" stroke="#c4ccd0" stroke-width="1"/><use href="#i-server" x="328.0" y="365.0" width="15" height="15" color="#68747b"/><text x="349.0" y="378.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#22292f" text-anchor="start">HTTP services</text><rect x="458.9" y="359.0" width="102.4" height="28.0" rx="14" fill="#ffffff" stroke="#c4ccd0" stroke-width="1"/><use href="#i-bell" x="468.9" y="365.0" width="15" height="15" color="#68747b"/><text x="489.9" y="378.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#22292f" text-anchor="start">Listeners</text><rect x="571.2" y="359.0" width="111.9" height="28.0" rx="14" fill="#ffffff" stroke="#c4ccd0" stroke-width="1"/><use href="#i-link" x="581.2" y="365.0" width="15" height="15" color="#68747b"/><text x="602.2" y="378.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#22292f" text-anchor="start">Connectors</text><rect x="693.1" y="359.0" width="1