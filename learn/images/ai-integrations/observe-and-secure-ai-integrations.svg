l="#22292f" text-anchor="start">HTTP service</text><text x="64.0" y="158.0" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#5f6b73" text-anchor="start">:8080</text><circle cx="48.0" cy="188.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="48.0" y="192.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">1</text><text x="66.0" y="192.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Validate the JWT and the scope</text><circle cx="48.0" cy="216.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="48.0" y="220.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">2</text><text x="66.0" y="220.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Validate the request, redact PII</text><circle cx="48.0" cy="244.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="48.0" y="248.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">3</text><text x="66.0" y="248.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Log and tag metadata, not content</text><circle cx="48.0" cy="272.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="48.0" y="276.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">4</text><text x="66.0" y="276.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Run the agent with an <tspan font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="0.93em" fill="#127a75">ai:Context</tspan> (policyholder ID)</text><circle cx="48.0" cy="300.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="48.0" y="304.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">5</text><text x="66.0" y="304.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Map the outcome to HTTP</text><rect x="500.0" y="116.0" width="170.0" height="60.0" rx="10" fill="#f2effc" stroke="#bdb1ee" stroke-width="1.25"/><use href="#i-model" x="513.0" y="128.0" width="18" height="18" color="#6b55cf"/><text x="540.0" y="142.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22292f" text-anchor="start">LLM</text><text x="540.0" y="160.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start">OpenAI</text><rect x="500.0" y="240.0" width="170.0" height="64.0" rx="10" fill="#20b6b0" stroke="#127a75" stroke-width="1.25"/><use href="#i-agent" x="513.0" y="254.0" width="18" height="18" color="#ffffff"/><text x="540.0" y="268.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="start">Agent</text><text x="540.0" y="286.0" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#e3fbf9" text-anchor="start">ai:Agent</text><text x="457.0" y="263.0" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="middle" paint-order="stroke" stroke="#fcfdfd" stroke-width="5" stroke-linejoin="round">run()</text><text x="652.0" y="202.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start" paint-order="stroke" stroke="#fcfdfd" stroke-width="5" stroke-linejoin="round">↑ redacted prompt + tool schemas</text><text x="652.0" y="221.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start" paint-order="stroke" stroke="#fcfdfd" stroke-width="5" stroke-linejoin="round">↓ tool calls, answer</text><rect x="395.0" y="376.0" width="182.0" height="52.0" rx="8" fill="#f1faf9" stroke="#9ad8d4" stroke-width="1.25"/><use href="#i-tool" x="405.0" y="386.0" width="16" height="16" color="#127a75"/><text x="429.0" y="397.0" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#22292f" text-anchor="start">getClaimStatus</text><use href="#i-key" x="429.0" y="405.0" width="13" height="13" color="#b46d07"/><text x="446.0" y="415.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6b73" text-anchor="start">read-only token</text><rect x="593.0" y="376.0" width="182.0" height="52.0" rx="8" fill="#f1faf9" stroke="#9ad8d4" stroke-width="1.25"/><use href="#i-tool" x="603.0" y="386.0" width="16" height="16" color="#127a75"/><text x="627.0" y="397.0" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#22292f" text-anchor="start">requestCallback</text><use href="#i-key" x="627.0" y="405.0" width="13" height="13" color="#b46d07"/><text x="644.0" y="415.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6b73" text-anchor="start">callback-only token</text><rect x="455.0" y="476.0" width="260.0" height="56.0" rx="10" fill="#f3f5f6" stroke="#c4ccd0" stroke-width="1.25"/><use href="#i-database" x="468.0" y="486.0" width="18" height="18" color="#68747b"/><text x="495.0" y="500.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22292f" text-anchor="start">Claims API</text><text x="495.0" y="518.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start"><tspan font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="0.93em" fill="#127a75">:9090</tspan> · mocked in this guide</text><text x="140.0" y="352.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start" paint-order="stroke" stroke="#fcfdfd" stroke-width="5" stroke-linejoin="round">Spans over OTLP</text><text x="140.0" y="370.0" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#5f6b73" text-anchor="start" paint-order="stroke" stroke="#fcfdfd" stroke-width="5" stroke-linejoin="round">HTTP · invoke_agent · chat · execute_tool</text><rect x="24.0" y="476.0" width="300.0" height="56.0" rx="10" fill="#f3f5f6" stroke="#c4ccd0" stroke-width="1.25"/><use href="#i-pulse" x="37.0" y="486.0" width="18" height="18" color="#68747b"/><text x="64.0" y="500.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22292f" text-anchor="start">OpenTelemetry collector</text><text x="64.0" y="518.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start">Jaeger or another collector · <tspan font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="0.93em" fill="#127a75">:4317</tspan></text></svg>
