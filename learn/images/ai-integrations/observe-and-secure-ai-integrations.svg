<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 554" width="880" height="554" role="img" aria-labelledby="t d"><title id="t">Secured and observed claims assistant</title><desc id="d">A mobile app calls the HTTP service with a scoped JWT. The service validates the token, redacts personal data, and runs the agent. Each tool calls the claims API with its own least-privilege token. Spans for HTTP, agent, model, and tool calls are exported to an OpenTelemetry collector.</desc><defs><symbol id="i-agent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4.5"/><circle cx="12" cy="3.5" r="1"/><path d="M9.5 13v1.5M14.5 13v1.5M2 13v3M22 13v3"/></symbol><symbol id="i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol><symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L20 3M16.5 6.5l3 3M14 9l2 2"/></symbol><symbol id="i-model" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5l1.9 5.1 5.1 1.9-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9z"/><path d="M18.5 15v5M16 17.5h5"/></symbol><symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2" width="11" height="20" rx="2.5"/><path d="M11 18h2"/></symbol><symbol id="i-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12h4l2.5-7 5 14 2.5-7h5"/></symbol><symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z"/><path d="M8.8 12l2.2 2.2 4.4-4.4"/></symbol><symbol id="i-tool" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0.8L9.5 5L0 9.2z" fill="#8f9ba1"/></marker></defs><rect x="0.5" y="0.5" width="879" height="553" rx="12" fill="#fcfdfd" stroke="#e3e8ea"/><path d="M130.0 80.0 L130.0 116.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M414.0 272.0 L500.0 272.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M610.0 240.0 L610.0 176.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M640.0 176.0 L640.0 240.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M585.0 304.0 L585.0 352.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round"/><path d="M486.0 352.0 L684.0 352.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round"/><path d="M486.0 352.0 L486.0 376.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M684.0 352.0 L684.0 376.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><circle cx="585.0" cy="352.0" r="2.6" fill="#8f9ba1"/><path d="M486.0 428.0 L486.0 454.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round"/><path d="M684.0 42