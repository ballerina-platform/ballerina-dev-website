292f" text-anchor="start">LLM</text><text x="690.0" y="193.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start">Any provider</text><text x="513.0" y="157.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="middle" paint-order="stroke" stroke="#fcfdfd" stroke-width="5" stroke-linejoin="round">prompt + JSON schema of <tspan font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="0.93em" fill="#127a75">Attraction[]</tspan></text><text x="513.0" y="211.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="middle" paint-order="stroke" stroke="#fcfdfd" stroke-width="5" stroke-linejoin="round">JSON response, bound to the type</text><rect x="36.0" y="308.0" width="119.5" height="32.0" rx="16.0" fill="#e8f6ee" stroke="#86cba4" stroke-width="1.25"/><text x="50.0" y="328.5" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#18794e" text-anchor="start">Attraction[]</text><rect x="167.5" y="308.0" width="142.4" height="32.0" rx="16.0" fill="#fcefee" stroke="#e6a6a3" stroke-width="1.25"/><text x="181.5" y="328.5" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#a3312f" text-anchor="start">400 Bad Request</text><rect x="321.9" y="308.0" width="142.4" height="32.0" rx="16.0" fill="#fcefee" stroke="#e6a6a3" stroke-width="1.25"/><text x="335.9" y="328.5" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#a3312f" text-anchor="start">502 Bad Gateway</text></svg>
