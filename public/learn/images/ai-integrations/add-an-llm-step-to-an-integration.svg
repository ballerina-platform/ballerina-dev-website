<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 402" width="880" height="402" role="img" aria-labelledby="t d"><title id="t">Ticket triage with an LLM step</title><desc id="d">The HTTP resource validates the ticket, calls the model with the JSON schema of Triage, validates the result, routes the ticket to a queue, and falls back on failure.</desc><defs><symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9M12 3c-2.5 2.6-3.8 5.6-3.8 9s1.3 6.4 3.8 9"/></symbol><symbol id="i-model" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5l1.9 5.1 5.1 1.9-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9z"/><path d="M18.5 15v5M16 17.5h5"/></symbol><symbol id="i-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0.8L9.5 5L0 9.2z" fill="#8f9ba1"/></marker></defs><rect x="0.5" y="0.5" width="879" height="401" rx="12" fill="#fcfdfd" stroke="#e3e8ea"/><path d="M146.0 56.0 L146.0 96.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M376.0 180.0 L650.0 180.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M650.0 206.0 L376.0 206.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M146.0 290.0 L146.0 314.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round"/><path d="M149.1 314.0 L345.4 314.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round"/><path d="M149.1 314.0 L149.1 336.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M345.4 314.0 L345.4 336.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><circle cx="146.0" cy="314.0" r="2.6" fill="#8f9ba1"/><rect x="36.0" y="22.0" width="334.1" height="34.0" rx="17.0" fill="#ffffff" stroke="#c4ccd0" stroke-width="1.25"/><use href="#i-globe" x="48.0" y="31.0" width="16" height="16" color="#68747b"/><text x="72.0" y="43.5" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#22292f" text-anchor="start">POST /support/tickets {subject, body}</text><rect x="36.0" y="96.0" width="340.0" height="194.0" rx="10" fill="#ffffff" stroke="#20b6b0" stroke-width="1.5"/><path d="M36.8 138.0V106.0a9.25 9.25 0 0 1 9.25-9.25H366.0a9.25 9.25 0 0 1 9.25 9.25V138.0z" fill="#e9f7f6"/><line x1="36.8" y1="138.0" x2="375.2" y2="138.0" stroke="#9ad8d4" stroke-width="1"/><use href="#i-server" x="49.0" y="107.0" width="18" height="18" color="#20b6b0"/><text x="76.0" y="121.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22292f" text-anchor="start">HTTP resource</text><circle cx="60.0" cy="160.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="60.0" y="164.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">1</text><text x="78.0" y="164.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Validate the payload</text><circle cx="60.0" cy="188.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="60.0" y="192.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">2</text><text x="78.0" y="192.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start"><tspan font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="0.93em" fill="#127a75">model-&gt;generate()</tspan></text><circle cx="60.0" cy="216.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="60.0" y="220.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">3</text><text x="78.0" y="220.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Validate the result</text><circle cx="60.0" cy="244.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="60.0" y="248.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">4</text><text x="78.0" y="248.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Route to a queue</text><circle cx="60.0" cy="272.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="60.0" y="276.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">5</text><text x="78.0" y="276.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Fall back on failure</text><rect x="650.0" y="159.0" width="194.0" height="68.0" rx="10" fill="#f2effc" stroke="#bdb1ee" stroke-width="1.25"/><use href="#i-model" x="663.0" y="175.0" width="18" height="18" color="#6b55cf"/><text x="690.0" y="189.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22292f" text-anchor="start">LLM</text><text x="690.0" y="207.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start">Any provider</text><text x="513.0" y="171.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="middle" paint-order="stroke" stroke="#fcfdfd" stroke-width="5" stroke-linejoin="round">prompt + JSON schema of <tspan font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="0.93em" fill="#127a75">Triage</tspan></text><text x="513.0" y="225.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="middle" paint-order="stroke" stroke="#fcfdfd" stroke-width="5" stroke-linejoin="round">JSON response, bound to the type</text><rect x="36.0" y="336.0" width="226.2" height="32.0" rx="16.0" fill="#e8f6ee" stroke="#86cba4" stroke-width="1.25"/><text x="50.0" y="356.5" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#18794e" text-anchor="start">RoutedTicket · 201 Created</text><rect x="274.2" y="336.0" width="142.4" height="32.0" rx="16.0" fill="#fcefee" stroke="#e6a6a3" stroke-width="1.25"/><text x="288.2" y="356.5" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#a3312f" text-anchor="start">400 Bad Request</text></svg>
