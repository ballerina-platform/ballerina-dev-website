<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" role="img" aria-labelledby="t d"><title id="t">Agent evaluation test</title><desc id="d">An evaluation dataset of conversation threads feeds a data-driven test. For each expected trace, the test runs the agent, applies rule checks, and asks a judge model to compare the answer with the reference answer. The test passes when the average pass rate over the runs reaches minPassRate.</desc><defs><symbol id="i-agent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4.5"/><circle cx="12" cy="3.5" r="1"/><path d="M9.5 13v1.5M14.5 13v1.5M2 13v3M22 13v3"/></symbol><symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.2l2.8 2.8L16.2 9.5"/></symbol><symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol><symbol id="i-flask" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5L4.6 18.6A2 2 0 0 0 6.3 21.5h11.4a2 2 0 0 0 1.7-2.9L14 9.5V3"/><path d="M7.2 15h9.6"/></symbol><symbol id="i-model" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5l1.9 5.1 5.1 1.9-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9z"/><path d="M18.5 15v5M16 17.5h5"/></symbol><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0.8L9.5 5L0 9.2z" fill="#8f9ba1"/></marker></defs><rect x="0.5" y="0.5" width="879" height="489" rx="12" fill="#fcfdfd" stroke="#e3e8ea"/><path d="M120.0 106.0 L120.0 160.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M584.0 265.0 L660.0 265.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ah)"/><path d="M584.0 333.0 L660.0 333.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ah)"/><path d="M120.0 356.0 L120.0 396.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="24.0" y="22.0" width="470.0" height="84.0" rx="10" fill="#f3f5f6" stroke="#c4ccd0" stroke-width="1.25"/><use href="#i-file" x="37.0" y="37.5" width="18" height="18" color="#68747b"/><text x="64.0" y="51.5" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" font-weight="600" fill="#22292f" text-anchor="start">broadband_support.evalset.json</text><text x="64.0" y="69.5" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start">tests/resources/evalsets/</text><text x="64.0" y="87.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start">Threads of traces: user message, expected tool calls, reference answer</text><text x="130.0" y="129.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start" paint-order="stroke" stroke="#fcfdfd" stroke-width="5" stroke-linejoin="round"><tspan font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="0.93em" fill="#127a75">ai:loadConversationThreads</tspan></text><text x="130.0" y="147.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6b73" text-anchor="start" paint-order="stroke" stroke="#fcfdfd" stroke-width="5" stroke-linejoin="round">data provider · one test entry per thread</text><rect x="24.0" y="160.0" width="560.0" height="196.0" rx="10" fill="#ffffff" stroke="#20b6b0" stroke-width="1.5"/><path d="M24.75 218V170a9.25 9.25 0 0 1 9.25-9.25H574a9.25 9.25 0 0 1 9.25 9.25V218z" fill="#e9f7f6"/><line x1="24.75" y1="218" x2="583.25" y2="218" stroke="#9ad8d4"/><use href="#i-flask" x="37.0" y="171.0" width="18" height="18" color="#20b6b0"/><text x="64.0" y="185.0" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" font-weight="600" fill="#22292f" text-anchor="start">evaluateSupportAgent(thread)</text><text x="64.0" y="205.0" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#5f6b73" text-anchor="start">@test:Config {groups: ["live-eval"], runs: 3, minPassRate: 0.8}</text><text x="40.0" y="240.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start">For each expected trace in the thread:</text><circle cx="48" cy="265" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="48.0" y="269.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">1</text><text x="66.0" y="269.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start"><tspan font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="0.93em" fill="#127a75">agent.run(user message)</tspan> returns an <tspan font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="0.93em" fill="#127a75">ai:Trace</tspan></text><circle cx="48" cy="299" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="48.0" y="303.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">2</text><text x="66.0" y="303.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Rule checks: tool calls, contact details</text><circle cx="48" cy="333" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="48.0" y="337.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">3</text><text x="66.0" y="337.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Judge model: answer vs. reference answer</text><rect x="660.0" y="238.0" width="196.0" height="54.0" rx="10" fill="#20b6b0" stroke="#127a75" stroke-width="1.25"/><use href="#i-agent" x="673.0" y="247.0" width="18" height="18" color="#ffffff"/><text x="700.0" y="261.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="start">Agent under test</text><text x="700.0" y="279.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e3fbf9" text-anchor="start">ai:Agent · OpenAI</text><rect x="660.0" y="306.0" width="196.0" height="54.0" rx="10" fill="#f2effc" stroke="#bdb1ee" stroke-width="1.25"/><use href="#i-model" x="673.0" y="315.0" width="18" height="18" color="#6b55cf"/><text x="700.0" y="329.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22292f" text-anchor="start">Judge model</text><text x="700.0" y="347.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start">OpenAI, temperature 0</text><text x="130.0" y="381.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start" paint-order="stroke" stroke="#fcfdfd" stroke-width="5" stroke-linejoin="round">repeated for each of the 3 runs</text><rect x="24.0" y="396.0" width="560.0" height="72.0" rx="10" fill="#e8f6ee" stroke="#86cba4" stroke-width="1.25"/><use href="#i-check" x="37.0" y="408.0" width="18" height="18" color="#18794e"/><text x="64.0" y="422.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#22292f" text-anchor="start">Pass rate of a run = passed threads / all threads</text><text x="64.0" y="444.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start">The test passes if the average over the runs is at least minPassRate.</text></svg>
