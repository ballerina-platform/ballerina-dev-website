ext-anchor="end" paint-order="stroke" stroke="#fcfdfd" stroke-width="5" stroke-linejoin="round">ingest(chunks)</text><rect x="440.0" y="48.0" width="288.4" height="34.0" rx="17.0" fill="#ffffff" stroke="#c4ccd0" stroke-width="1.25"/><use href="#i-globe" x="452.0" y="57.0" width="16" height="16" color="#68747b"/><text x="476.0" y="69.5" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#22292f" text-anchor="start">POST /hr/ask {"question": ".."}</text><rect x="440.0" y="104.0" width="256.0" height="194.0" rx="10" fill="#ffffff" stroke="#20b6b0" stroke-width="1.5"/><path d="M440.8 146.0V114.0a9.25 9.25 0 0 1 9.25-9.25H686.0a9.25 9.25 0 0 1 9.25 9.25V146.0z" fill="#e9f7f6"/><line x1="440.8" y1="146.0" x2="695.2" y2="146.0" stroke="#9ad8d4" stroke-width="1"/><use href="#i-server" x="453.0" y="115.0" width="18" height="18" color="#20b6b0"/><text x="480.0" y="129.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22292f" text-anchor="start">HTTP service</text><circle cx="464.0" cy="168.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="464.0" y="172.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">1</text><text x="482.0" y="172.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Validate the question</text><circle cx="464.0" cy="196.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="464.0" y="200.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">2</text><text x="482.0" y="200.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Retrieve the top K chunks</text><circle cx="464.0" cy="224.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="464.0" y="228.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">3</text><text x="482.0" y="228.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Drop chunks below min score</text><circle cx="464.0" cy="252.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="464.0" y="256.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">4</text><text x="482.0" y="256.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Generate a typed answer</text><circle cx="464.0" cy="280.0" r="9" fill="#e9f7f6" stroke="#9ad8d4"/><text x="464.0" y="284.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#127a75" text-anchor="middle">5</text><text x="482.0" y="284.5" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#22292f" text-anchor="start">Check the cited sources</text><text x="395.0" y="188.0" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#5f6b73" text-anchor="middle" paint-order="stroke" stroke="#fcfdfd" stroke-width="5" stroke-linejoin="round">retrieve()</text><rect x="752.0" y="222.0" width="104.0" height="60.0" rx="10" fill="#f2effc" stroke="#bdb1ee" stroke-width="1.25"/><use href="#i-model" x="765.0" y="234.0" width="18" height="18" color="#6b55cf"/><text x="792.0" y="248.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#22292f" text-anchor="start">LLM</text><text x="792.0" y="266.0" font-family="Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6b73" text-anchor="start">OpenAI</text><rect x="440.0" y="334.0" width="119.5" height="32.0" rx="16.0" fill="#e8f6ee" stroke="#86cba4" stroke-width="1.25"/><text x="454.0" y="354.5" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#18794e" text-anchor="start">PolicyAnswer</text><rect x="569.5" y="334.0" width="50.9" height="32.0" rx="16.0" fill="#fcefee" stroke="#e6a6a3" stroke-width="1.25"/><text x="583.5" y="354.5" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#a3312f" text-anchor="start">400</text><rect x="630.4" y="334.0" width="50.9" height="32.0" rx="16.0" fill="#fcefee" stroke="#e6a6a3" stroke-width="1.25"/><text x="644.4" y="354.5" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#a3312f" text-anchor="start">502</text><rect x="691.2" y="334.0" width="50.9" height="32.0" rx="16.0" fill="#fcefee" stroke="#e6a6a3" stroke-width="1.25"/><text x="705.2" y="354.5" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="500" fill="#a3312f" text-anchor="start">503</text></svg>
