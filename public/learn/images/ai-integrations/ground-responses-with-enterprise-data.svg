<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 444" width="880" height="444" role="img" aria-labelledby="t d"><title id="t">HR policy assistant</title><desc id="d">At startup, policy documents are loaded, chunked with source metadata, and ingested into a vector knowledge base. Per request, the service retrieves the closest chunks, drops weak matches, asks the LLM for a typed answer, and checks the cited sources.</desc><defs><symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5h6a3.5 3.5 0 0 1 3.5 3.5V20a2.5 2.5 0 0 0-2.5-2.5h-7z"/><path d="M21.5 5h-6A3.5 3.5 0 0 0 12 8.5V20a2.5 2.5 0 0 1 2.5-2.5h7z"/></symbol><symbol id="i-chunk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="5" rx="1.5"/><rect x="3" y="10.5" width="18" height="5" rx="1.5"/><rect x="3" y="17.5" width="11" height="3.5" rx="1.5"/></symbol><symbol id="i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol><symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol><symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9M12 3c-2.5 2.6-3.8 5.6-3.8 9s1.3 6.4 3.8 9"/></symbol><symbol id="i-model" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3.5l1.9 5.1 5.1 1.9-5.1 1.9L11 17.5l-1.9-5.1L4 10.5l5.1-1.9z"/><path d="M18.5 15v5M16 17.5h5"/></symbol><symbol id="i-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0.8L9.5 5L0 9.2z" fill="#8f9ba1"/></marker></defs><rect x="0.5" y="0.5" width="879" height="443" rx="12" fill="#fcfdfd" stroke="#e3e8ea"/><path d="M164.0 82.0 L164.0 104.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M164.0 160.0 L164.0 184.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M164.0 240.0 L164.0 300.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M520.0 82.0 L520.0 104.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M440.0 196.0 L350.0 196.0 L350.0 300.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M696.0 252.0 L752.0 252.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ah)"/><path d="M520.0 298.0 L520.0 320.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round"/><path d="M499.8 320.0 L716.7 320.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round"/><path d="M499.8 320.0 L499.8 334.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M594.9 320.0 L594.9 334.0" fill="none" stroke="#8f9ba1" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M655.8 320.0 L65